<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bureau of Tourism | X-Topia</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap");

    :root {
      --font-official: "Exo 2", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      --bg: #06080b;
      --line: #203041;
      --text: #e9eef6;
      --muted: #8ea2ba;
      --accent: #66c8ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--font-official);
      background:
        radial-gradient(circle at 80% 12%, rgba(102, 200, 255, 0.14), transparent 30%),
        radial-gradient(circle at 18% 86%, rgba(102, 200, 255, 0.08), transparent 36%),
        var(--bg);
    }

    .page {
      display: grid;
      min-height: 100vh;
      grid-template-rows: auto 1fr;
      padding: 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .back-link {
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .back-link:hover {
      text-shadow: 0 0 14px rgba(102, 200, 255, 0.6);
    }

    .content {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 22px;
      align-items: center;
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 28px 0;
    }

    .map-preview {
      width: 100%;
      min-height: 520px;
      background-image: url("images/mape_xtopia.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
    }

    .panel {
      border-left: 1px solid rgba(102, 200, 255, 0.34);
      padding: 26px 0 26px 28px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 5vw, 72px);
      line-height: 0.95;
      text-transform: uppercase;
    }

    .sub {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: clamp(16px, 1.8vw, 22px);
      font-weight: 600;
    }

    p {
      margin: 0;
      color: #c8d6e6;
      font-size: clamp(15px, 1.4vw, 18px);
      line-height: 1.6;
    }

    @media (max-width: 820px) {
      .content {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .map-preview {
        min-height: 320px;
      }

      .panel {
        border-left: 0;
        border-top: 1px solid rgba(102, 200, 255, 0.34);
        padding: 22px 0 0;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="back-link" href="visitor.html">Back to Visitor</a>
    </header>

    <main class="content">
      <div class="map-preview" role="img" aria-label="X-Topia map"></div>
      <section class="panel" aria-labelledby="tourismTitle">
        <h1 id="tourismTitle">Bureau of Tourism</h1>
        <p class="sub">Official Visitor Orientation</p>
        <p>The Bureau of Tourism coordinates visitor access, district orientation, public routes, and authorized points of discovery across X-Topia.</p>
      </section>
    </main>
  </div>
</body>
</html>
