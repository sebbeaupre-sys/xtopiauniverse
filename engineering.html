<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Engineering Department Maintenance</title>
  <style>
    :root {
      --bg: #06080b;
      --panel: #0d1219;
      --text: #e9eef6;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Exo 2", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px;
    }
    .frame {
      width: min(640px, 100%);
      border-radius: 18px;
      border: 1px solid rgba(233, 238, 246, 0.35);
      background: var(--panel);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      padding: 32px;
      text-align: center;
    }

    .frame img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="frame">
    <img src="images/maintenance.png" alt="Maintenance placeholder for Engineering Department" />
  </div>
</body>
</html>
